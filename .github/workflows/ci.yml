name: Application checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: endpoint_watch_test
          # Disposable CI database only; not a deployment credential.
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d endpoint_watch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/endpoint_watch_test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: endpoint_watch_test
      PGPASSWORD: ci-test-only
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations and verify schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f ../../db/migrate.sql
          psql -X -v ON_ERROR_STOP=1 -f ../../db/tests/schema.sql
      - name: Run all tests including PostgreSQL integration tests
        run: npm test
      - name: Type-check tests
        run: npm run typecheck:tests
      - name: Build
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit/component tests
        run: npm test
      - name: Type-check and build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test built frontend through Compose and Express
        run: npm run test:e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
